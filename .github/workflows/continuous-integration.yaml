---
name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
    branches:
    - master
  push:
    branches:
    - master

permissions:
  contents: read

cache-mode: none

env:
  CARDANO_NODE_VERSION: "11.1.3"
  NETWORK: preprod

jobs:
  fork-checks:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: true
        persist-credentials: false

    - name: Install Nix
      uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
      with:
        extra_nix_config: |
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
          substituters = https://cache.iog.io/ https://cache.nixos.org/
          allow-import-from-derivation = true

    - name: Run tests without a live Cardano node
      run: nix build --no-link --print-build-logs .#checks.x86_64-linux.kupo-unit

  # TODO: switch back to this once Hydra reports check-runs to GitHub
  # wait-for-hydra:
  #   runs-on: ubuntu-latest
  #   steps:
  #   - name: Wait for Hydra build
  #     env:
  #       GH_TOKEN: ${{ github.token }}
  #     run: |
  #       check_name="ci/hydra-build:required"
  #       while true; do
  #         conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=$check_name" \
  #           --paginate --jq '.check_runs[].conclusion')
  #         case "$conclusion" in
  #           success) echo "Hydra build succeeded"; exit 0 ;;
  #           "") echo "Hydra build pending, waiting 30s..."; sleep 30 ;;
  #           *) echo "Hydra build failed with: $conclusion"; exit 1 ;;
  #         esac
  #       done

  integration-tests:
    # Repository writers are trusted to run integration tests with AWS access.
    # This routes fork jobs; GitHub's fork secret/token restrictions enforce isolation.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      S3_DB_PATH: s3://${{ secrets.AWS_S3_BUCKET }}/db-preprod
    # needs:
    # - wait-for-hydra
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        submodules: true
        persist-credentials: false

    - name: Install Nix
      uses: cachix/install-nix-action@b97f05dcb019ddea06450a50ef6203d2fdc19fee # v31
      with:
        extra_nix_config: |
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ=
          substituters = https://cache.iog.io/ https://cache.nixos.org/

    # Temporary: poll the Nix cache directly until Hydra check-run reporting is fixed.
    # Use the PR head SHA on pull_request events (not $GITHUB_SHA, which is the
    # ephemeral merge commit GitHub creates server-side and that Hydra doesn't see).
    # Falls back to $GITHUB_SHA on push events.
    - name: Wait for kupo binaries in Hydra cache
      env:
        TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -o pipefail
        echo "Target SHA: $TARGET_SHA"
        flake_ref="git+https://github.com/$GITHUB_REPOSITORY?rev=$TARGET_SHA&submodules=1"
        deadline=$((SECONDS + 1800))
        for attr in kupo-tests kupo-tests-accept kupo; do
          if ! out=$(nix eval --raw "$flake_ref#$attr"); then
            echo "nix eval failed for $attr"
            exit 1
          fi
          if [ -z "$out" ]; then
            echo "nix eval returned an empty path for $attr"
            exit 1
          fi
          drv=$(nix eval --raw "$flake_ref#$attr.drvPath" 2>/dev/null || true)
          echo "[$attr] resolved store path: $out"
          echo "[$attr] derivation path:     $drv"
          echo "[$attr] waiting for $out in cache..."
          while true; do
            if nix path-info --refresh --store https://cache.iog.io "$out" >/dev/null 2>&1; then
              echo "[$attr] found in cache"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out after 30 minutes waiting for Hydra cache ($attr path: $out)"
              exit 1
            fi
            echo "[$attr] not in cache yet, waiting 30s..."
            sleep 30
          done
        done

    - name: Download binaries from Hydra cache
      env:
        TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        flake_ref="git+https://github.com/$GITHUB_REPOSITORY?rev=$TARGET_SHA&submodules=1"
        mkdir -p bin
        for pair in "kupo-tests:unit" "kupo-tests-accept:accept" "kupo:kupo"; do
          attr="${pair%%:*}"
          exe="${pair##*:}"
          nix build "$flake_ref#$attr" --builders "" --max-jobs 0 -o "result-$exe"
          cp "result-$exe/bin/$exe" "bin/$exe"
          chmod +x "bin/$exe"
        done

    - name: Download cardano-node configs
      env:
        BASE_URL: https://raw.githubusercontent.com/input-output-hk/cardano-playground/refs/tags/node-${{ env.CARDANO_NODE_VERSION }}-config/docs/environments/preprod
      run: |
        mkdir -p config/preprod
        cd config/preprod
        for f in config.json topology.json peer-snapshot.json \
                 byron-genesis.json shelley-genesis.json alonzo-genesis.json conway-genesis.json; do
          curl -sfLO "$BASE_URL/$f"
        done

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Restore cardano-node DB from S3
      env:
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        nix shell nixpkgs#s5cmd -c \
          ./.github/workflows/scripts/preprod-db-restore.sh "$S3_DB_PATH" "$RUNNER_TEMP/db-preprod"

    - name: Start cardano-node and wait for sync
      id: node
      timeout-minutes: 30
      env:
        CONFDIR: ${{ github.workspace }}/config/preprod
        RUNNER_TEMP: ${{ runner.temp }}
      # Preserve the existing integration-test threshold of 99.99%.
      run: ./.github/workflows/scripts/preprod-node-sync.sh 0.9999

    - name: Run integration tests
      env:
        CARDANO_NODE_SOCKET: ${{ runner.temp }}/ipc/node.socket
        CARDANO_NODE_CONFIG: ${{ github.workspace }}/config/preprod/config.json
      run: sudo -E ./bin/unit

    # The accept suite asks `cardano-cli` for the node tip. The attribute is
    # cached on cache.iog.io; --max-jobs 0 stops CI from ever building it.
    - name: Provide cardano-cli
      run: |
        nix build "github:IntersectMBO/cardano-node/$CARDANO_NODE_VERSION#cardano-cli" \
          --builders "" --max-jobs 0 -o result-cardano-cli
        cp result-cardano-cli/bin/cardano-cli bin/cardano-cli

    # Run from the checkout: the suite reads and writes test-accept/point-*.dat.
    # sudo resets PATH, so pass it explicitly.
    - name: Run acceptance tests
      env:
        CARDANO_NODE_SOCKET: ${{ runner.temp }}/ipc/node.socket
        CARDANO_NODE_CONFIG: ${{ github.workspace }}/config/preprod/config.json
      # Skipped tests are known to be flaky.
      run: |
        sudo -E env "PATH=$PWD/bin:$PATH" ./bin/accept \
          --skip "Auto-magically restarts when --defer-db-indexes is enabled" \
          --skip "Dynamically adds pattern and rolls back (when at tip)"

    - name: Stop cardano-node
      if: always() && steps.node.outputs.node-started == 'true'
      run: |
        docker stop -t 300 cardano-node
        docker rm cardano-node
